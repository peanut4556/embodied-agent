<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Embodied Agent · 桌面仿真</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#e2eaf5;background:#0c1220}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1500px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:26px;margin:6px 0}p{color:#91a2ba;font-size:14px;line-height:1.6}.eyebrow{font-size:12px;letter-spacing:2px;color:#6cdccc}.badge{color:#74ded1;border:1px solid #27554e;padding:8px 13px;border-radius:30px;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}.card{background:#141e2e;border:1px solid #263449;border-radius:16px;padding:22px}.scene{padding:0;overflow:hidden}canvas{width:100%;display:block;aspect-ratio:1.6}.scene-footer{display:flex;gap:24px;padding:20px;border-top:1px solid #263449;font-size:13px;color:#a4b5cb}.dot{color:#63decd}label{display:block;font-size:13px;color:#a6b6cc;margin-bottom:10px}textarea,select{font:inherit;width:100%;color:#e2eaf5;background:#0c1422;border:1px solid #354760;border-radius:8px;padding:12px}textarea{resize:vertical;min-height:88px}select{margin:12px 0}button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 15px;cursor:pointer;background:#62dac8;color:#08251e}button:disabled{opacity:.4;cursor:wait}.controls{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#25354c;color:#d3dfef}.stop{background:#482a36;color:#ffafbc}h2{font-size:16px;margin:0 0 16px}#status{font-size:18px;line-height:1.5;margin:20px 0 12px}#plan{padding:0;list-style:none;max-height:240px;overflow:auto}#plan li{padding:9px 10px;margin:6px 0;border-left:2px solid #354860;background:#182638;font:13px ui-monospace,monospace}#plan li.active{border-color:#6ce0ce;color:#7de3d4}#events{font:12px/1.8 ui-monospace,monospace;white-space:pre-wrap;overflow:auto;max-height:190px;color:#9eb3cf}.wide{margin-top:20px}#error{color:#ffabbc;min-height:20px;font-size:13px}.small{font-size:12px}@media(max-width:920px){body{padding:16px}main{grid-template-columns:1fr}header{gap:15px}.badge{white-space:nowrap}}
</style>
<header><div><div class="eyebrow">EMBODIED AGENT / LOCAL LAB</div><h1>从一句话，到一次抓取</h1><p>Qwen 规划 · ROS 2 执行 · 仿真位置验收</p></div><span class="badge" id="connection">正在连接</span></header>
<main><div class="card scene"><canvas id="scene" width="1120" height="700" aria-label="二维机械臂、红色积木和目标盒子的实时仿真"></canvas><div class="scene-footer"><span><span class="dot">●</span> 二维运动学</span><span id="holding">夹爪：空</span><span id="position">积木：桌面</span></div></div>
<section class="card"><h2>任务控制</h2><label for="instruction">告诉机械臂要做什么</label><textarea id="instruction">把桌上的红色积木放进盒子</textarea><label for="planner" style="margin-top:12px">规划方式</label><select id="planner"><option value="rai">本地 Qwen · 自然语言规划</option><option value="rule">规则计划 · 快速验证链路</option></select><div class="controls"><button id="run">执行任务</button><button id="stop" class="stop">停止</button><button id="reset" class="secondary">重置</button></div><div id="error" role="alert"></div><div id="status" aria-live="polite">准备就绪</div><p class="small">首次模型规划可能需要一分钟。此演示只验证积木入盒任务；重试前可重置场景。</p><ol id="plan"></ol></section></main>
<section class="card wide"><h2>执行记录</h2><div id="events">等待任务。每一步完成后，由 ROS 2 状态 Topic 返回结果。</div></section>
<p class="small">当前为两连杆运动学仿真，使用预设抓放轨迹与夹爪附着规则；不包含接触动力学、摩擦和碰撞检测。</p>
<script>
const $=id=>document.getElementById(id),c=$('scene'),ctx=c.getContext('2d');let world=null,busy=false,lastEvents='';
async function command(path,payload={}){try{$('error').textContent='';const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error);await poll()}catch(e){$('error').textContent=e.message}}
$('run').onclick=()=>command('run',{instruction:$('instruction').value,planner:$('planner').value});$('stop').onclick=()=>command('stop');$('reset').onclick=()=>command('reset');
async function poll(){try{const r=await fetch('/api/state');const d=await r.json();if(!r.ok)throw Error(d.error);world=d.world;busy=d.busy;$('connection').textContent='● ROS 2 已连接';$('status').textContent=d.task.message;$('status').style.color=d.task.phase==='success'?'#70e1cc':d.task.phase==='failed'?'#ffb4c0':'#e2eaf5';$('run').disabled=busy;$('reset').disabled=busy;$('holding').textContent='夹爪：'+(world.holding?'红色积木':'空');$('position').textContent='积木：'+(world.inside_box?'盒内':world.holding?'随夹爪移动':'桌面');const list=$('plan');list.replaceChildren();d.task.plan.forEach((step,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+step.action+' '+(step.arguments.object||'')+(step.arguments.destination?' → '+step.arguments.destination:'');if(i===d.task.current&&busy)li.className='active';list.appendChild(li)});const events=d.task.events.map(e=>e.time+'  '+e.text).join('\n');if(events!==lastEvents){$('events').textContent=events||'等待任务';$('events').scrollTop=$('events').scrollHeight;lastEvents=events}draw()}catch(e){$('connection').textContent='ROS 2 连接中断';$('error').textContent=e.message}}
function point(p){return [180+p[0]*1100,570-p[1]*1100]}
function line(a,b,color,width){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function circle(p,r,color){ctx.beginPath();ctx.arc(...p,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill()}
function text(t,p,color='#a5b8d1',size=16){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.fillText(t,...p)}
function draw(){ctx.fillStyle='#101a2b';ctx.fillRect(0,0,c.width,c.height);for(let x=40;x<c.width;x+=55)line([x,70],[x,570],'#1b2a40',1);for(let y=75;y<570;y+=55)line([40,y],[1080,y],'#1b2a40',1);text('TABLETOP  /  实时场景',[38,42],'#7e9cbd',14);line([55,588],[1080,588],'#344964',18);if(!world)return;const base=point(world.base),elbow=point(world.elbow),tip=point(world.tip),block=point(world.block),box=point(world.box);ctx.fillStyle='#284256';ctx.fillRect(box[0]-84,box[1]+28,168,18);line([box[0]-82,box[1]-36],[box[0]-82,box[1]+38],'#659396',10);line([box[0]+82,box[1]-36],[box[0]+82,box[1]+38],'#659396',10);text('目标盒子',[box[0]-37,635]);ctx.fillStyle='#425976';ctx.fillRect(base[0]-46,base[1]-12,92,150);line(base,elbow,'#68829e',30);line(base,elbow,'#9bb8cf',16);line(elbow,tip,'#68829e',26);line(elbow,tip,'#abc5d6',12);circle(base,25,'#273d58');circle(base,10,'#63d8c7');circle(elbow,22,'#273d58');circle(elbow,9,'#63d8c7');circle(tip,12,'#72dcca');const gap=world.holding?25:37;line([tip[0]-gap,tip[1]-18],[tip[0]-gap,tip[1]+18],'#71dfcb',7);line([tip[0]+gap,tip[1]-18],[tip[0]+gap,tip[1]+18],'#71dfcb',7);line([tip[0]-gap,tip[1]-18],[tip[0]+gap,tip[1]-18],'#71dfcb',5);ctx.fillStyle='#fa6575';ctx.fillRect(block[0]-23,block[1]-23,46,46);ctx.fillStyle='#ffabb4';ctx.fillRect(block[0]-16,block[1]-16,15,5);text(world.inside_box?'已进入目标区域':'红色积木',[block[0]-40,block[1]-42],world.inside_box?'#75e3cf':'#ffb5bf',14);text('肩关节 '+(world.joints[0]*180/Math.PI).toFixed(1)+'°  /  肘关节 '+(world.joints[1]*180/Math.PI).toFixed(1)+'°',[38,675],'#809bb9',14);text('x '+world.block[0].toFixed(3)+' m   z '+world.block[1].toFixed(3)+' m',[740,675],'#809bb9',14)}
draw();poll();setInterval(poll,180);
</script>
</html>
